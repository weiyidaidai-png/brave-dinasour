<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙跑酷游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header"><div class="mode">模式: <span id="current-mode">Day Mode</span></div>
            <div class="score">分数: <span id="current-score">0</span></div>
            <div class="high-score">最高分: <span id="high-score">0</span></div>
            <div class="speed">速度: <span id="current-speed">1.0</span>x</div>
            <div class="coins">金币: <span id="current-coins">0</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="200"></canvas>
        <div class="game-controls">
            <button id="startButton">开始游戏</button>

            <!-- 皮肤选择区域 -->
            <div class="skin-selector">
                <h3>选择恐龙皮肤</h3>
                <div class="skin-options" id="skinOptions">
                    <div class="skin-option active" data-skin="default" title="默认皮肤">
                        <div class="skin-preview" style="background-color: #000;"></div>
                        <span>默认</span>
                    </div>
                    <div class="skin-option" data-skin="green" title="绿色皮肤">
                        <div class="skin-preview" style="background-color: #2ecc71;"></div>
                        <span>绿色</span>
                    </div>
                    <div class="skin-option" data-skin="blue" title="蓝色皮肤">
                        <div class="skin-preview" style="background-color: #3498db;"></div>
                        <span>蓝色</span>
                    </div>
                    <div class="skin-option" data-skin="red" title="红色皮肤">
                        <div class="skin-preview" style="background-color: #e74c3c;"></div>
                        <span>红色</span>
                    </div>
                    <div class="skin-option" data-skin="yellow" title="黄色皮肤（带皇冠）">
                        <div class="skin-preview" style="background-color: #f1c40f;"></div>
                        <span>黄色</span>
                    </div>
                    <div class="skin-option" data-skin="purple" title="紫色皮肤（带角）">
                        <div class="skin-preview" style="background-color: #9b59b6;"></div>
                        <span>紫色</span>
                    </div>
                </div>
            </div>

            <div class="instructions">
                <p>游戏说明：</p>
                <p>1. 使用空格键或点击屏幕让恐龙跳跃</p>
                <p>2. 避开路上的仙人掌障碍物</p>
                <p>3. 跑得越远，分数越高</p>
                <p>4. 游戏会记录你的最高分数</p>
            </div>
        </div>
        <div id="gameOver" class="game-over hidden">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="final-score">0</span></p>
            <p>收集金币: <span id="final-coins">0</span></p>
            <button id="restartButton">重新开始</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
